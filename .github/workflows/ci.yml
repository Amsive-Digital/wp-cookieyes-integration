name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  PYTHONDONTWRITEBYTECODE: "1"
permissions:
  contents: read
jobs:
  verify:
    name: Verify PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax and contract checks
        run: |
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php tests/plugin-contract.php
          php tests/updater-contract.php
      - name: Release metadata and package checks
        run: |
          python3 scripts/release.py check
          python3 tests/release-contract.py
          python3 scripts/release.py build --output "$RUNNER_TEMP/package"
          git diff --check
